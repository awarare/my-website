<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="icon2.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あわられのYouTubeチャンネル</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #333;

            display: flex;
            justify-content: center;
           
            align-items: center;
            box-sizing: border-box;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5)
            max-width: 500px;
            width: 90%; 
            margin: 40 auto;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            box-sizing: border-box;
        }
        h1 { color: #6a5acd; }
        .btn {
            background: linear-gradient(45deg, #6a5acd, #8a2be2);
            display: inline-block;
            background-color: #6a5acd;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 25px;
            margin-top: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(106, 90, 205, 0.4);
        }
        .btn:hover {
            background-color: #483d8b;
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(106, 90, 205, 0.6);
        }
        .video-container{
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        .video-container iframe{
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border: none;
            display: block;
        }
        .schedule-box {
            background: rgba(255, 255, 255, 0.6);
            border: 1px dashed #6a5acd;
            border-radius: 12px;
            padding: 15px;
            margin: 25px auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="icon2.png" width="100" style="border-radius: 50%;">
        <h1>あわられのYouTubeチャンネルへようこそ！</h1>
        <p>ゲーム配信をまったりやっています。</p>
        <a href="profile.html" class="btn"><i class="fa-solid fa-user"></i> プロフィールを見る</a>
        <p>↓最新の動画はこちら</p>
        <div class="video-container">
            <iframe width="560" height="315" src="https://www.youtube.com/embed/6JH9MLciDbU?si=WzbknVpKJuPWBOX2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div class="schedule-box">
        <h3>次回の配信予定</h3>
        <p>今週末の夜19時から</p>
        
        <!--ボタンを押すと別タブで開くリンク-->
       <a href="https://youtube.com/channel/UCBBCDI23RHUUbyA0NGIbA_A?si=HojveoofENivoQF-" target="_blank" class="btn"><i class="fa-brands fa-youtube"></i> チャンネルを見に行く</a>
        <a href="https://x.com/awarareee" target="_blank" class="btn"><i class="fa-brands fa-x-twitter"></i> Twitterはこちら</a>
        
    </div>
   <!--グラミング第一歩！</h1>
    <p style="color: red; font-size: 24px;">動け自分のコード</p>

<button onclick="alert('押したね！')">ここを押してみて</button>-->
</body>
</html>
